<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ingredients Centre Tz — Duka la Mtandaoni</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f8fafb; color: #1a2b3c; line-height: 1.6; }

  header { background: linear-gradient(135deg, #0d5c63 0%, #14919b 100%); color: white; padding: 20px 16px; text-align: center; position: relative; }
  header h1 { font-size: 22px; font-weight: 700; }
  header p { font-size: 13px; opacity: 0.9; margin-top: 4px; }
  .cart-btn { position: absolute; top: 16px; right: 16px; background: rgba(255,255,255,0.2); border: none; color: white; padding: 8px 14px; border-radius: 20px; font-size: 14px; cursor: pointer; font-weight: 600; }
  .cart-btn:hover { background: rgba(255,255,255,0.3); }

  .search-wrap { max-width: 600px; margin: 20px auto; padding: 0 16px; }
  .search-wrap input { width: 100%; padding: 12px 16px; border: 1px solid #d1d9e0; border-radius: 10px; font-size: 15px; outline: none; background: white; }
  .search-wrap input:focus { border-color: #14919b; }

  .cats { display: flex; gap: 8px; overflow-x: auto; padding: 0 16px 16px; max-width: 1200px; margin: 0 auto; }
  .cat { padding: 8px 16px; background: white; border: 1px solid #d1d9e0; border-radius: 20px; font-size: 13px; white-space: nowrap; cursor: pointer; }
  .cat.active { background: #14919b; color: white; border-color: #14919b; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; max-width: 1200px; margin: 0 auto; padding: 0 16px 100px; }
  .card { background: white; border-radius: 12px; overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,0.06); display: flex; flex-direction: column; }
  .card img { width: 100%; height: 130px; object-fit: cover; background: #eef2f5; }
  .card .info { padding: 10px 12px; flex: 1; display: flex; flex-direction: column; }
  .card h3 { font-size: 14px; font-weight: 600; margin-bottom: 4px; line-height: 1.3; }
  .card .cat-label { font-size: 11px; color: #14919b; text-transform: uppercase; margin-bottom: 6px; }
  .card .price { font-size: 16px; font-weight: 700; color: #0d5c63; margin-bottom: 8px; }
  .card .unit { font-size: 11px; color: #6b7a88; font-weight: 400; }
  .card .add-btn { margin-top: auto; padding: 8px; background: #14919b; color: white; border: none; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; }
  .card .add-btn:hover { background: #0d5c63; }

  /* CART DRAWER */
  .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); display: none; z-index: 998; }
  .overlay.open { display: block; }
  .cart-drawer { position: fixed; top: 0; right: -400px; width: 100%; max-width: 400px; height: 100%; background: white; z-index: 999; transition: right 0.3s; display: flex; flex-direction: column; }
  .cart-drawer.open { right: 0; }
  .cart-head { padding: 16px; border-bottom: 1px solid #eef2f5; display: flex; justify-content: space-between; align-items: center; }
  .cart-head h2 { font-size: 18px; }
  .cart-head button { background: none; border: none; font-size: 24px; cursor: pointer; color: #6b7a88; }
  .cart-items { flex: 1; overflow-y: auto; padding: 16px; }
  .cart-item { display: flex; gap: 12px; padding: 12px 0; border-bottom: 1px solid #eef2f5; }
  .cart-item img { width: 60px; height: 60px; border-radius: 8px; object-fit: cover; }
  .cart-item .details { flex: 1; }
  .cart-item .details h4 { font-size: 14px; margin-bottom: 4px; }
  .cart-item .details .price { font-size: 13px; color: #0d5c63; font-weight: 600; }
  .cart-item .qty { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
  .cart-item .qty button { width: 24px; height: 24px; border: 1px solid #d1d9e0; background: white; border-radius: 6px; cursor: pointer; }
  .cart-item .qty span { font-size: 13px; min-width: 20px; text-align: center; }
  .cart-item .remove { background: none; border: none; color: #d9534f; cursor: pointer; font-size: 12px; margin-top: 4px; }
  .cart-foot { padding: 16px; border-top: 1px solid #eef2f5; background: #f8fafb; }
  .cart-total { display: flex; justify-content: space-between; font-size: 18px; font-weight: 700; margin-bottom: 12px; }
  .checkout-btn { width: 100%; padding: 14px; background: #25D366; color: white; border: none; border-radius: 10px; font-size: 16px; font-weight: 700; cursor: pointer; }
  .checkout-btn:hover { background: #1da851; }
  .checkout-btn:disabled { background: #ccc; cursor: not-allowed; }
  .empty-cart { text-align: center; padding: 40px 20px; color: #6b7a88; }

  footer { text-align: center; padding: 24px 16px; font-size: 12px; color: #6b7a88; background: white; border-top: 1px solid #eef2f5; }
</style>
</head>
<body>

<header>
  <h1>Ingredients Centre Tz</h1>
  <p>Bidhaa bora kwa bei nafuu</p>
  <button class="cart-btn" onclick="openCart()">🛒 Cart (<span id="cartCount">0</span>)</button>
</header>

<div class="search-wrap">
  <input type="text" id="searchBox" placeholder="🔍 Tafuta bidhaa..." oninput="filterProducts()">
</div>

<div class="cats" id="catBar"></div>
<div class="grid" id="productGrid"></div>

<div class="overlay" id="overlay" onclick="closeCart()"></div>
<div class="cart-drawer" id="cartDrawer">
  <div class="cart-head">
    <h2>Kikapu Chako</h2>
    <button onclick="closeCart()">×</button>
  </div>
  <div class="cart-items" id="cartItems"></div>
  <div class="cart-foot">
    <div class="cart-total">
      <span>Jumla:</span>
      <span id="cartTotal">TZS 0</span>
    </div>
    <button class="checkout-btn" id="checkoutBtn" onclick="checkout()">Agiza kwa WhatsApp</button>
  </div>
</div>

<footer>
  © 2026 Ingredients Centre Tz · Mawasiliano: +255 XXX XXX XXX
</footer>

<script>
/* ============================================================
   MIPANGILIO — BADILISHA NAMBA YA WHATSAPP HAPA
   ============================================================ */
const WHATSAPP_NUMBER = "255XXXXXXXXX"; // <-- WEWE BADILISHA
const CURRENCY = "TZS";

/* ============================================================
   HAPA CHINI SI LAZIMA KUBADILISHA
   ============================================================ */
let allProducts = [];
let cart = JSON.parse(localStorage.getItem("cart") || "[]");
let activeCat = "Zote";

async function loadProducts() {
  try {
    const res = await fetch("/content/products.json");
    const data = await res.json();
    allProducts = data.products;
    renderCategories();
    renderProducts(allProducts);
    updateCartUI();
  } catch (e) {
    document.getElementById("productGrid").innerHTML =
      '<p style="grid-column:1/-1;text-align:center;padding:40px;color:#d9534f;">Imeshindwa kupakia bidhaa. Tafadhali jaribu tena.</p>';
  }
}

function renderCategories() {
  const cats = ["Zote", ...new Set(allProducts.map(p => p.category))];
  document.getElementById("catBar").innerHTML = cats.map((c, i) =>
    `<button class="cat ${i===0?'active':''}" onclick="selectCat(this, '${c}')">${c}</button>`
  ).join("");
}

function selectCat(btn, cat) {
  document.querySelectorAll(".cat").forEach(b => b.classList.remove("active"));
  btn.classList.add("active");
  activeCat = cat;
  filterProducts();
}

function filterProducts() {
  const q = document.getElementById("searchBox").value.toLowerCase();
  const filtered = allProducts.filter(p => {
    const matchCat = activeCat === "Zote" || p.category === activeCat;
    const matchSearch = p.name.toLowerCase().includes(q);
    return matchCat && matchSearch;
  });
  renderProducts(filtered);
}

function renderProducts(list) {
  if (list.length === 0) {
    document.getElementById("productGrid").innerHTML =
      '<p style="grid-column:1/-1;text-align:center;padding:40px;color:#6b7a88;">Hakuna bidhaa iliyopatikana.</p>';
    return;
  }
  document.getElementById("productGrid").innerHTML = list.map((p, i) => `
    <div class="card">
      <img src="${p.image}" alt="${p.name}" loading="lazy" onerror="this.src='https://via.placeholder.com/400x300/eef2f5/6b7a88?text=Bidhaa'">
      <div class="info">
        <div class="cat-label">${p.category}</div>
        <h3>${p.name}</h3>
        <div class="price">${CURRENCY} ${p.price.toLocaleString()} <span class="unit">${p.unit}</span></div>
        <button class="add-btn" onclick='addToCart(${JSON.stringify(p).replace(/'/g, "&apos;")})'>Ongeza kwenye Kikapu</button>
      </div>
    </div>
  `).join("");
}

function addToCart(product) {
  const existing = cart.find(item => item.name === product.name);
  if (existing) {
    existing.qty += 1;
  } else {
    cart.push({ ...product, qty: 1 });
  }
  saveCart();
  updateCartUI();
  openCart();
}

function removeFromCart(name) {
  cart = cart.filter(item => item.name !== name);
  saveCart();
  updateCartUI();
}

function changeQty(name, delta) {
  const item = cart.find(i => i.name === name);
  if (!item) return;
  item.qty += delta;
  if (item.qty <= 0) removeFromCart(name);
  else { saveCart(); updateCartUI(); }
}

function saveCart() {
  localStorage.setItem("cart", JSON.stringify(cart));
}

function updateCartUI() {
  const count = cart.reduce((s, i) => s + i.qty, 0);
  document.getElementById("cartCount").textContent = count;

  if (cart.length === 0) {
    document.getElementById("cartItems").innerHTML =
      '<div class="empty-cart">Kikapu chako ni kitupu.<br>Ongeza bidhaa ili kuanza.</div>';
    document.getElementById("cartTotal").textContent = `${CURRENCY} 0`;
    document.getElementById("checkoutBtn").disabled = true;
    return;
  }

  document.getElementById("cartItems").innerHTML = cart.map(item => `
    <div class="cart-item">
      <img src="${item.image}" alt="${item.name}">
      <div class="details">
        <h4>${item.name}</h4>
        <div class="price">${CURRENCY} ${item.price.toLocaleString()} ${item.unit}</div>
        <div class="qty">
          <button onclick="changeQty('${item.name}', -1)">−</button>
          <span>${item.qty}</span>
          <button onclick="changeQty('${item.name}', 1)">+</button>
        </div>
        <button class="remove" onclick="removeFromCart('${item.name}')">Ondoa</button>
      </div>
    </div>
  `).join("");

  const total = cart.reduce((s, i) => s + i.price * i.qty, 0);
  document.getElementById("cartTotal").textContent = `${CURRENCY} ${total.toLocaleString()}`;
  document.getElementById("checkoutBtn").disabled = false;
}

function openCart() {
  document.getElementById("cartDrawer").classList.add("open");
  document.getElementById("overlay").classList.add("open");
}

function closeCart() {
  document.getElementById("cartDrawer").classList.remove("open");
  document.getElementById("overlay").classList.remove("open");
}

function checkout() {
  if (cart.length === 0) return;
  const total = cart.reduce((s, i) => s + i.price * i.qty, 0);
  let msg = "Habari, nataka kuagiza bidhaa zifuatazo:\n\n";
  cart.forEach((item, i) => {
    msg += `${i + 1}. ${item.name} — ${item.qty} x ${CURRENCY} ${item.price.toLocaleString()} = ${CURRENCY} ${(item.price * item.qty).toLocaleString()}\n`;
  });
  msg += `\nJUMLA: ${CURRENCY} ${total.toLocaleString()}\n\nAsante!`;
  window.open(`https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(msg)}`, "_blank");
}

loadProducts();
</script>
</body>
</html>
